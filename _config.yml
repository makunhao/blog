# Hexo Configuration
# Docs: https://hexo.io/docs/configuration.html

# Site
title: makunhao 的博客
subtitle: '网络安全 / 靶场实战 / 折腾记录'
description: '记录网络安全学习、靶场实战与代码笔记'
keywords: 网络安全,渗透测试,应急响应,安全加固,红蓝对抗,WriteUp
author: 马坤豪
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://makunhao.cn
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: false
  hljs: false

# Home page setting
index_generator:
  path: ''
  per_page: 8
  order_by: -date

default_category: 未分类
category_map:
tag_map:

meta_generator: true

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

per_page: 10
pagination_dir: page

include:
exclude:
ignore:

# Extensions
theme: butterfly

# Deployment
deploy:
  type: ''
